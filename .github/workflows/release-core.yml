name: Publish CLIProxyAPI Pro Docker and Management

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cliproxyapi-pro-core/**'
      - '.github/workflows/release-core.yml'
  schedule:
    - cron: '0 */3 * * *'

concurrency:
  group: cli-proxyapi-pro-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      should_release: ${{ steps.compare.outputs.should_release }}
      core_tag: ${{ steps.compare.outputs.core_tag }}
      core_version: ${{ steps.compare.outputs.core_version }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
      release_version: ${{ steps.compare.outputs.release_version }}
      management_tag: ${{ steps.compare.outputs.management_tag }}
      management_version: ${{ steps.compare.outputs.management_version }}

    steps:
      - name: Compare latest upstream releases
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
          CORE_UPSTREAM_REPO: router-for-me/CLIProxyAPI
          MANAGEMENT_UPSTREAM_REPO: router-for-me/Cli-Proxy-API-Management-Center
        run: |
          set -euo pipefail

          normalize_version() {
            local version="$1"
            version="${version#v}"
            version="${version%-pro}"
            echo "${version}"
          }

          pro_tag_for() {
            local tag="$1"
            tag="${tag%-pro}"
            echo "${tag}-pro"
          }

          version_gt() {
            local left="$1"
            local right="$2"
            [ "$(printf '%s\n%s\n' "${right}" "${left}" | sort -V | tail -n 1)" = "${left}" ] && [ "${left}" != "${right}" ]
          }

          core_tag="$(gh release view --repo "${CORE_UPSTREAM_REPO}" --json tagName --jq '.tagName')"
          management_tag="$(gh release view --repo "${MANAGEMENT_UPSTREAM_REPO}" --json tagName --jq '.tagName')"
          current_tag="$(gh release view --repo "${CURRENT_REPO}" --json tagName --jq '.tagName' 2>/dev/null || true)"

          core_version="$(normalize_version "${core_tag}")"
          management_version="$(normalize_version "${management_tag}")"
          release_tag="$(pro_tag_for "${core_tag}")"
          release_version="${release_tag#v}"

          current_version="0.0.0"
          if [ -n "${current_tag}" ]; then
            current_version="$(normalize_version "${current_tag}")"
          fi

          target_exists="false"
          has_management_asset="false"
          if gh release view "${release_tag}" --repo "${CURRENT_REPO}" >/dev/null 2>&1; then
            target_exists="true"
            has_management_asset="$(gh release view "${release_tag}" --repo "${CURRENT_REPO}" --json assets --jq 'any(.assets[]; .name == "management.html")')"
          fi

          should_release="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            should_release="true"
          elif [ "${target_exists}" = "false" ]; then
            should_release="true"
          elif [ "${has_management_asset}" != "true" ]; then
            should_release="true"
          elif version_gt "${core_version}" "${current_version}"; then
            should_release="true"
          fi

          echo "current_tag=${current_tag:-none}"
          echo "current_version=${current_version}"
          echo "core_tag=${core_tag}"
          echo "core_version=${core_version}"
          echo "management_tag=${management_tag}"
          echo "management_version=${management_version}"
          echo "release_tag=${release_tag}"
          echo "release_version=${release_version}"
          echo "target_exists=${target_exists}"
          echo "has_management_asset=${has_management_asset}"
          echo "should_release=${should_release}"

          echo "core_tag=${core_tag}" >> "${GITHUB_OUTPUT}"
          echo "core_version=${core_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "management_tag=${management_tag}" >> "${GITHUB_OUTPUT}"
          echo "management_version=${management_version}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

  build-docker-image:
    needs:
      - check-version
      - build-management-html
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout customizations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download management artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: management-html
          path: cliproxyapi-pro-management/.ci-artifacts

      - name: Verify management artifact
        run: test -s cliproxyapi-pro-management/.ci-artifacts/management.html

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./cliproxyapi-pro-core/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/cliproxyapi-pro,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CLIPROXY_VERSION=${{ needs.check-version.outputs.core_tag }}
            CLIPROXY_BUILD_VERSION=${{ needs.check-version.outputs.release_tag }}

      - name: Export Docker digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "${digest}" ]; then
            echo "Docker build did not produce a digest." >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Docker digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-manifest:
    needs:
      - check-version
      - build-docker-image
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download Docker digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push Docker manifest
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/cliproxyapi-pro
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
        run: |
          set -euo pipefail

          refs=()
          for digest_file in /tmp/digests/*; do
            refs+=("${DOCKER_IMAGE}@sha256:$(basename "${digest_file}")")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No Docker digests found." >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:latest" \
            -t "${DOCKER_IMAGE}:${RELEASE_TAG}" \
            "${refs[@]}"

          docker buildx imagetools inspect "${DOCKER_IMAGE}:${RELEASE_TAG}"

  build-management-html:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout customizations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: customizations-repo
          fetch-depth: 1

      - name: Checkout management upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: router-for-me/Cli-Proxy-API-Management-Center
          ref: ${{ needs.check-version.outputs.management_tag }}
          path: upstream-management
          fetch-depth: 1

      - name: Test management customizations
        run: python3 -m unittest discover -s customizations-repo/cliproxyapi-pro-management/tests -p 'test_*.py'

      - name: Apply Pro management customizations
        run: bash customizations-repo/cliproxyapi-pro-management/apply.sh upstream-management

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('upstream-management/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install management dependencies
        working-directory: upstream-management
        run: bun install --frozen-lockfile

      - name: Test management
        working-directory: upstream-management
        run: bun run test

      - name: Lint management
        working-directory: upstream-management
        run: bun run lint

      - name: Build management HTML
        working-directory: upstream-management
        env:
          VERSION: v${{ needs.check-version.outputs.management_version }}-pro
        run: bun run build

      - name: Prepare management asset
        working-directory: upstream-management
        run: |
          set -euo pipefail
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Upload management artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: management-html
          path: upstream-management/dist/management.html
          if-no-files-found: error
          retention-days: 7

  publish-management-asset:
    needs:
      - check-version
      - merge-docker-manifest
      - build-management-html
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download management artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: management-html
          path: release-assets

      - name: Create release notes
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.release_version }}
          CORE_TAG: ${{ needs.check-version.outputs.core_tag }}
          MANAGEMENT_TAG: ${{ needs.check-version.outputs.management_tag }}
          MANAGEMENT_VERSION: ${{ needs.check-version.outputs.management_version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          CUSTOMIZATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          CLIProxyAPI Pro release built from upstream releases. This workflow publishes only the Docker image and the management frontend file.

          ## Version mapping

          - Release tag: ${RELEASE_TAG}
          - Release version: ${RELEASE_VERSION}
          - Core upstream release: ${CORE_TAG}
          - Docker image: ${DOCKER_USERNAME}/cliproxyapi-pro:${RELEASE_TAG}
          - Docker latest image: ${DOCKER_USERNAME}/cliproxyapi-pro:latest
          - Management upstream release: ${MANAGEMENT_TAG}
          - Management build version: v${MANAGEMENT_VERSION}-pro
          - Customization commit: ${CUSTOMIZATION_SHA}

          ## Assets

          - Docker image: ${DOCKER_USERNAME}/cliproxyapi-pro:${RELEASE_TAG}
          - Frontend file: management.html

          <!-- cli-proxyapi-pro-management-start -->
          ## Management upstream release notes

          Management frontend was rebuilt from ${MANAGEMENT_TAG}.
          <!-- cli-proxyapi-pro-management-end -->
          EOF

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

          old_binary_assets="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' |
              grep -E '^(CLIProxyAPI_.*\.(tar\.gz|zip)|checksums\.txt)$' || true
          )"

          while IFS= read -r asset; do
            if [ -z "${asset}" ]; then
              continue
            fi
            gh release delete-asset "${RELEASE_TAG}" "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes || true
          done <<< "${old_binary_assets}"

          gh release upload "${RELEASE_TAG}" \
            release-assets/management.html \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
