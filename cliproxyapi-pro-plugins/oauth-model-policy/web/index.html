<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OAuth 模型策略</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f7f8;--panel:#fff;--text:#20252d;--muted:#687383;--line:#dfe4e8;--accent:#13765b;--accent-soft:#e7f5f0;--danger:#bd3434;--shadow:0 1px 3px rgba(16,24,40,.08)}
    @media(prefers-color-scheme:dark){:root{--bg:#10151a;--panel:#191f25;--text:#eef2f5;--muted:#9ca8b7;--line:#343d46;--accent:#47bd97;--accent-soft:#19382f;--danger:#f07171;--shadow:none}}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:not-allowed}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.danger{color:var(--danger)}main{max-width:1280px;margin:auto;padding:22px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:23px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.actions,.tabs,.plan-head,.custom-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.settings{display:grid;grid-template-columns:120px repeat(3,minmax(160px,1fr));gap:12px;align-items:end}.field{display:grid;gap:6px}.field span{color:var(--muted);font-size:12px}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 9px}textarea{min-height:82px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.tabs{border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:9px 12px}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.plans{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:12px}.plan{border:1px solid var(--line);border-radius:8px;padding:13px}.plan.disabled{opacity:.66}.plan-head{justify-content:space-between;margin-bottom:9px}.plan-name{display:flex;align-items:center;gap:8px;font-weight:650}.plan-name input{width:16px;height:16px}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:11px}.fallback{color:var(--accent);border-color:var(--accent)}.custom-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.custom-row input{max-width:320px}.notice{min-height:20px;color:var(--muted);font-size:13px}.notice.error{color:var(--danger)}.notice.good{color:var(--accent)}.sticky{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:11px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}.dirty{display:inline-flex;align-items:center;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:4px 9px;font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:820px){main{padding:14px}.settings{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr}header{flex-direction:column}.actions{width:100%}.actions button{flex:1}}
    @media(max-width:520px){.settings{grid-template-columns:1fr}.custom-row{align-items:stretch}.custom-row input,.custom-row button{max-width:none;width:100%}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>OAuth 模型策略</h1><div class="muted">按提供商与账号套餐控制模型可用范围，配置和执行均由 oauth-model-policy 插件持有</div></div>
    <div class="actions"><span id="dirty" class="dirty" hidden>有未保存修改</span><button id="refresh" type="button">重新加载</button><button id="save-top" class="primary" type="button" disabled>保存</button></div>
  </header>
  <section class="panel settings">
    <div><strong>插件设置</strong><div class="muted">正时长使用 s、m 或 h</div></div>
    <label class="field"><span>优先级</span><input id="priority" type="number" step="1" disabled></label>
    <label class="field"><span>套餐缓存时间</span><input id="cache-ttl" placeholder="30m" disabled></label>
    <label class="field"><span>套餐探测超时</span><input id="resolve-timeout" placeholder="15s" disabled></label>
  </section>
  <section class="panel">
    <nav id="providers" class="tabs" aria-label="提供商"></nav>
    <div id="plans" class="plans"></div>
    <div class="custom-row"><input id="custom-plan" placeholder="自定义套餐键，例如 enterprise" disabled><button id="add-plan" type="button" disabled>添加自定义套餐</button></div>
  </section>
  <div id="notice" class="notice"></div>
  <div class="sticky"><button id="discard" type="button" disabled>放弃修改</button><button id="save" class="primary" type="button" disabled>保存配置</button></div>
</main>
<script>
(() => {
  'use strict';
  const PLUGIN_ID = 'oauth-model-policy';
  const REQUEST_SOURCE = 'cliproxy-plugin-resource';
  const RESPONSE_SOURCE = 'cliproxy-plugin-host';
  const PROVIDERS = [
    {id:'xai',label:'xAI',plans:['free','supergrok','x-premium-plus','supergrok-heavy','paid-unknown']},
    {id:'codex',label:'Codex',plans:['free','plus','pro','pro-lite','team']},
    {id:'claude',label:'Claude',plans:['free','pro','max','team']},
    {id:'gemini-cli',label:'Gemini CLI',plans:['free','legacy','standard','pro','ultra']},
    {id:'antigravity',label:'Antigravity',plans:['free','pro','ultra','ultra-lite']},
    {id:'kimi',label:'Kimi',plans:[]}
  ];
  const FALLBACKS = ['_unknown','_default'];
  const pending = new Map();
  let sequence = 0;
  let config = null;
  let baseline = null;
  let activeProvider = 'xai';
  const $ = (id) => document.getElementById(id);
  const escapeHTML = (value) => String(value == null ? '' : value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = (value) => JSON.parse(JSON.stringify(value));
  const asObject = (value) => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  const normalizeKey = (value) => {let key=String(value||'').trim().toLowerCase().replace(/_/g,'-');if(key.startsWith('plan-'))key=key.slice(5);return key.replace(/[^a-z0-9._+-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');};
  const normalizePatterns = (value) => {const seen=new Set();return (Array.isArray(value)?value:[]).map((item)=>String(item||'').trim().toLowerCase()).filter((item)=>item&&!seen.has(item)&&seen.add(item));};
  const request = (method,path,body) => new Promise((resolve,reject)=>{const id='oauth-policy-'+(++sequence)+'-'+Date.now();pending.set(id,{resolve,reject});window.parent.postMessage({source:REQUEST_SOURCE,id,method,path,body},'*');setTimeout(()=>{if(pending.delete(id))reject(new Error('请求超时'));},30000);});
  window.addEventListener('message',(event)=>{const message=event.data;if(!message||message.source!==RESPONSE_SOURCE||!pending.has(message.id))return;const task=pending.get(message.id);pending.delete(message.id);if(message.ok)task.resolve(message.data);else task.reject(new Error(message.error&&message.error.message||'请求失败'));});
  const defaults = () => ({priority:10,'cache-ttl':'30m','resolve-timeout':'15s',providers:{}});
  const normalizeConfig = (raw) => {const result={...defaults(),...asObject(raw)};result.priority=Number.isFinite(Number(result.priority))?Math.trunc(Number(result.priority)):10;result['cache-ttl']=String(result['cache-ttl']||'30m');result['resolve-timeout']=String(result['resolve-timeout']||'15s');result.providers=asObject(result.providers);for(const provider of PROVIDERS){const current=asObject(result.providers[provider.id]);const plans=asObject(current.plans);for(const [key,value] of Object.entries(plans)){plans[key]={...asObject(value),'excluded-models':normalizePatterns(asObject(value)['excluded-models'])};}result.providers[provider.id]={...current,plans};}return result;};
  const providerConfig = (providerID) => {const provider=asObject(config.providers[providerID]);provider.plans=asObject(provider.plans);config.providers[providerID]=provider;return provider;};
  const configuredPlans = (providerID) => providerConfig(providerID).plans;
  const allPlans = (definition) => {const known=[...definition.plans,...FALLBACKS],seen=new Set(known);for(const key of Object.keys(configuredPlans(definition.id)).sort()){if(!seen.has(key)){known.splice(Math.max(known.length-FALLBACKS.length,0),0,key);seen.add(key);}}return known;};
  const setNotice = (message,kind='') => {const node=$('notice');node.textContent=message||'';node.className='notice'+(kind?' '+kind:'');};
  const isDirty = () => JSON.stringify(config)!==JSON.stringify(baseline);
  const syncDirty = () => {const dirty=isDirty();$('dirty').hidden=!dirty;$('save').disabled=!dirty;$('save-top').disabled=!dirty;$('discard').disabled=!dirty;};
  const setEditorEnabled = (enabled) => {for(const id of ['priority','cache-ttl','resolve-timeout','custom-plan','add-plan'])$(id).disabled=!enabled;};
  const syncSettings = () => {$('priority').value=config.priority;$('cache-ttl').value=config['cache-ttl'];$('resolve-timeout').value=config['resolve-timeout'];};
  const renderProviders = () => {$('providers').innerHTML=PROVIDERS.map((provider)=>'<button type="button" class="tab '+(provider.id===activeProvider?'active':'')+'" data-provider="'+provider.id+'">'+escapeHTML(provider.label)+'</button>').join('');};
  const renderPlans = () => {const definition=PROVIDERS.find((item)=>item.id===activeProvider)||PROVIDERS[0],plans=configuredPlans(definition.id);$('plans').innerHTML=allPlans(definition).map((key)=>{const configured=Object.prototype.hasOwnProperty.call(plans,key),rule=asObject(plans[key]),patterns=normalizePatterns(rule['excluded-models']),fallback=key.startsWith('_'),custom=!definition.plans.includes(key)&&!fallback;return '<article class="plan '+(configured?'':'disabled')+'" data-plan="'+escapeHTML(key)+'"><div class="plan-head"><label class="plan-name"><input type="checkbox" data-action="toggle" '+(configured?'checked':'')+'><span>'+escapeHTML(key)+'</span>'+(fallback?'<span class="tag fallback">回退</span>':custom?'<span class="tag">自定义</span>':'')+'</label>'+(custom?'<button type="button" class="danger" data-action="remove">删除</button>':'')+'</div><label class="field"><span>排除模型，一行一个 glob；空列表表示明确不排除</span><textarea data-action="patterns" '+(configured?'':'disabled')+' placeholder="gpt-5-pro-*">'+escapeHTML(patterns.join('\n'))+'</textarea></label></article>';}).join('')||'<div class="empty">暂无套餐规则</div>';syncDirty();};
  const render = () => {syncSettings();renderProviders();renderPlans();};
  const load = async () => {setNotice('加载中…');$('refresh').disabled=true;setEditorEnabled(false);try{config=normalizeConfig(await request('GET','/plugins/'+PLUGIN_ID+'/config'));baseline=clone(config);render();setEditorEnabled(true);setNotice('配置已从插件加载','good');}catch(error){setNotice(error.message,'error');}finally{$('refresh').disabled=false;}};
  const validDuration = (value) => /^\d+(?:\.\d+)?(?:ns|us|µs|ms|s|m|h)$/.test(value.trim())&&Number.parseFloat(value)>0;
  const validate = () => {if(!Number.isFinite(config.priority))throw new Error('优先级必须是整数');if(!validDuration(config['cache-ttl']))throw new Error('套餐缓存时间必须是正 Go duration，例如 30m');if(!validDuration(config['resolve-timeout']))throw new Error('套餐探测超时必须是正 Go duration，例如 15s');};
  const save = async () => {try{validate();setNotice('保存中…');$('save').disabled=true;$('save-top').disabled=true;await request('PATCH','/plugins/'+PLUGIN_ID+'/config',config);await load();setNotice('模型策略已保存并重新加载','good');}catch(error){setNotice(error.message,'error');syncDirty();}};
  $('providers').addEventListener('click',(event)=>{const button=event.target.closest('[data-provider]');if(!button)return;activeProvider=button.dataset.provider;renderProviders();renderPlans();});
  $('plans').addEventListener('change',(event)=>{const target=event.target,card=target.closest('[data-plan]');if(!card)return;const key=card.dataset.plan,plans=configuredPlans(activeProvider);if(target.dataset.action==='toggle'){if(target.checked)plans[key]={'excluded-models':[]};else delete plans[key];renderPlans();return;}if(target.dataset.action==='patterns'){plans[key]={'excluded-models':normalizePatterns(target.value.split(/\r?\n|,/))};syncDirty();}});
  $('plans').addEventListener('input',(event)=>{const target=event.target,card=target.closest('[data-plan]');if(!card||target.dataset.action!=='patterns')return;configuredPlans(activeProvider)[card.dataset.plan]={'excluded-models':normalizePatterns(target.value.split(/\r?\n|,/))};syncDirty();});
  $('plans').addEventListener('click',(event)=>{const button=event.target.closest('[data-action="remove"]'),card=event.target.closest('[data-plan]');if(!button||!card)return;delete configuredPlans(activeProvider)[card.dataset.plan];renderPlans();});
  $('add-plan').onclick=()=>{const input=$('custom-plan'),key=normalizeKey(input.value);if(!key||key.startsWith('_')){setNotice('请输入有效的自定义套餐键','error');return;}const plans=configuredPlans(activeProvider);if(Object.prototype.hasOwnProperty.call(plans,key)){setNotice('该套餐规则已存在','error');return;}plans[key]={'excluded-models':[]};input.value='';renderPlans();setNotice('已添加自定义套餐，保存后生效');};
  $('priority').addEventListener('input',()=>{config.priority=Math.trunc(Number($('priority').value));syncDirty();});
  $('cache-ttl').addEventListener('input',()=>{config['cache-ttl']=$('cache-ttl').value.trim();syncDirty();});
  $('resolve-timeout').addEventListener('input',()=>{config['resolve-timeout']=$('resolve-timeout').value.trim();syncDirty();});
  $('save').onclick=save;$('save-top').onclick=save;$('refresh').onclick=load;$('discard').onclick=()=>{config=clone(baseline);render();setNotice('已放弃未保存修改');};
  load();
})();
</script>
</body>
</html>
