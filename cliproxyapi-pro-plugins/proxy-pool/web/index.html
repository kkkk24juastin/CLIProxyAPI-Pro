<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>代理池</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f5f6f8; --panel:#fff; --text:#20242c; --muted:#677080; --line:#dfe3e8; --accent:#17745b; --danger:#c33737; --warn:#a46708; --shadow:0 1px 3px rgba(16,24,40,.08); }
    @media (prefers-color-scheme: dark) { :root { --bg:#11151a; --panel:#191e25; --text:#eef1f5; --muted:#9ca6b5; --line:#343b45; --accent:#44b993; --danger:#f06d6d; --warn:#e4aa49; --shadow:none; } }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; background:var(--bg); color:var(--text); font-size:14px; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { min-height:34px; border:1px solid var(--line); background:var(--panel); padding:6px 11px; border-radius:6px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    button.primary { background:var(--accent); border-color:var(--accent); color:white; }
    button.danger { color:var(--danger); }
    input,select,textarea { width:100%; min-height:34px; border:1px solid var(--line); border-radius:5px; background:var(--panel); padding:7px 9px; }
    textarea { min-height:100px; resize:vertical; }
    .app { max-width:1500px; margin:0 auto; padding:18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    h1 { margin:0; font-size:22px; font-weight:680; }
    h2 { margin:0; font-size:15px; }
    .actions,.tabs,.row-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tabs { border-bottom:1px solid var(--line); margin-bottom:14px; }
    .tab { border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; padding:9px 12px; }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .stats { display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:10px; margin-bottom:14px; }
    .stat,.panel { border:1px solid var(--line); background:var(--panel); box-shadow:var(--shadow); border-radius:7px; }
    .stat { padding:12px; }
    .stat span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .stat strong { font-size:19px; }
    .panel { padding:14px; margin-bottom:14px; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(180px,1fr)); gap:12px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    label input,label select,label textarea { color:var(--text); font-size:14px; }
    .check { display:flex; align-items:center; gap:7px; min-height:34px; }
    .check input { width:16px; min-height:16px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:6px; }
    table { width:100%; border-collapse:collapse; min-width:940px; }
    th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-size:12px; font-weight:600; background:color-mix(in srgb,var(--panel) 88%,var(--bg)); }
    tr:last-child td { border-bottom:0; }
    td input { min-width:100px; }
    td.url input { min-width:260px; }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 7px; font-size:12px; }
    .healthy { color:var(--accent); }.isolated,.degraded { color:var(--warn); }.error { color:var(--danger); }
    .muted { color:var(--muted); }.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .notice { min-height:20px; margin:8px 0; color:var(--muted); }
    .notice.error { color:var(--danger); }
    .import-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
    [hidden] { display:none !important; }
    @media (max-width:900px) { .stats { grid-template-columns:repeat(2,1fr); } .form-grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:600px) { .app { padding:12px; } header { align-items:flex-start; flex-direction:column; } .stats,.form-grid { grid-template-columns:1fr; } .import-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>代理池</h1><div id="runtime" class="muted"></div></div>
      <div class="actions">
        <button id="takeover">接管全局代理</button>
        <button id="refresh" title="刷新">刷新</button>
        <button id="save" class="primary">保存</button>
      </div>
    </header>
    <div id="notice" class="notice"></div>
    <section class="stats">
      <div class="stat"><span>节点</span><strong id="stat-total">-</strong></div>
      <div class="stat"><span>健康</span><strong id="stat-healthy">-</strong></div>
      <div class="stat"><span>隔离</span><strong id="stat-isolated">-</strong></div>
      <div class="stat"><span>活动连接</span><strong id="stat-active">-</strong></div>
      <div class="stat"><span>配置代次</span><strong id="stat-generation">-</strong></div>
    </section>
    <nav class="tabs">
      <button class="tab active" data-view="nodes">节点</button>
      <button class="tab" data-view="settings">设置</button>
      <button class="tab" data-view="diagnostics">诊断</button>
    </nav>
    <section id="view-nodes">
      <div class="panel">
        <div class="panel-head"><h2>节点配置</h2><div class="actions"><button id="add-node">添加</button><button id="test-all">全部测试</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>启用</th><th>ID</th><th>名称</th><th>代理 URL</th><th>权重</th><th>顺序</th><th>状态</th><th>操作</th></tr></thead><tbody id="nodes"></tbody></table><div id="nodes-empty" class="empty">暂无节点</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>批量导入</h2></div>
        <div class="import-row"><label>每行一个 URL，或 名称 | URL | 权重<textarea id="import" placeholder="Proxy A | socks5://user:pass@host:1080 | 2"></textarea></label><button id="import-button">导入</button></div>
      </div>
    </section>
    <section id="view-settings" hidden>
      <div class="panel"><div class="form-grid">
        <label>监听地址<input id="listen"></label><label>策略<select id="strategy"><option value="round-robin">轮询</option><option value="weighted">加权轮询</option><option value="least-connections">最少连接</option></select></label><label>优先级<input id="priority" type="number"></label>
        <label>拨号超时<input id="dial-timeout"></label><label>最大故障转移次数<input id="max-failover" type="number" min="1"></label><label class="check"><input id="fail-open" type="checkbox">允许全部失败时直连</label>
        <label class="check"><input id="health-enabled" type="checkbox">启用健康检查</label><label>检查间隔<input id="health-interval"></label><label>检查超时<input id="health-timeout"></label>
        <label>隔离阈值<input id="isolation-threshold" type="number" min="1"></label><label>隔离时长<input id="isolation-duration"></label><label>探测地址<input id="probe-address"></label><label>测试 URL<input id="test-url"></label>
      </div></div>
    </section>
    <section id="view-diagnostics" hidden>
      <div class="panel"><div class="panel-head"><h2>运行状态</h2><button id="reset-stats">重置统计</button></div><div id="diagnostics" class="mono muted"></div></div>
      <div class="panel"><div class="panel-head"><h2>节点结果</h2></div><div class="table-wrap"><table><thead><tr><th>节点</th><th>状态</th><th>成功率</th><th>延迟</th><th>出口</th><th>最近错误</th></tr></thead><tbody id="status-nodes"></tbody></table></div></div>
    </section>
  </main>
  <script>
  (() => {
    const PLUGIN_ID = 'proxy-pool';
    const pending = new Map();
    let sequence = 0;
    let config = null;
    let status = null;
    let globalProxy = '';
    const $ = (id) => document.getElementById(id);
    const value = (id) => $(id).value;
    const number = (id, fallback) => { const result = Number(value(id)); return Number.isFinite(result) ? result : fallback; };
    const escapeHTML = (input) => String(input == null ? '' : input).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const notify = (message, error) => { $('notice').textContent = message || ''; $('notice').className = error ? 'notice error' : 'notice'; };
    const request = (method, path, body) => new Promise((resolve, reject) => {
      const id = 'proxy-pool-' + (++sequence) + '-' + Date.now();
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ source:'cliproxy-plugin-resource', id, method, path, body }, '*');
      setTimeout(() => { if (pending.delete(id)) reject(new Error('请求超时')); }, 30000);
    });
    window.addEventListener('message', (event) => {
      const message = event.data;
      if (!message || message.source !== 'cliproxy-plugin-host' || !pending.has(message.id)) return;
      const task = pending.get(message.id); pending.delete(message.id);
      if (message.ok) task.resolve(message.data); else task.reject(new Error(message.error && message.error.message || '请求失败'));
    });
    const defaults = () => ({ enabled:true, priority:100, listen:'127.0.0.1:8318', strategy:'round-robin', 'dial-timeout':'8s', 'max-failover-attempts':3, 'fail-open':false, 'restore-proxy-url':'', 'health-check':{enabled:true,interval:'30s',timeout:'8s','isolation-threshold':3,'isolation-duration':'5m','probe-address':'www.gstatic.com:443','test-url':'https://ipwho.is/'}, nodes:[] });
    const normalize = (raw) => { const d=defaults(), h=raw && raw['health-check'] || {}; return { ...d, ...(raw||{}), 'health-check':{...d['health-check'],...h}, nodes:Array.isArray(raw && raw.nodes)?raw.nodes.map((n,i)=>({id:String(n.id||('proxy-'+(i+1))),label:String(n.label||''),url:String(n.url||''),enabled:n.enabled!==false,weight:Math.max(1,Number(n.weight)||1),order:Number(n.order)||((i+1)*10)})):[] }; };
    const localProxy = () => 'socks5://' + (config && config.listen || '127.0.0.1:8318');
    const syncSettings = () => { const h=config['health-check']; $('listen').value=config.listen; $('strategy').value=config.strategy; $('priority').value=config.priority; $('dial-timeout').value=config['dial-timeout']; $('max-failover').value=config['max-failover-attempts']; $('fail-open').checked=config['fail-open']; $('health-enabled').checked=h.enabled; $('health-interval').value=h.interval; $('health-timeout').value=h.timeout; $('isolation-threshold').value=h['isolation-threshold']; $('isolation-duration').value=h['isolation-duration']; $('probe-address').value=h['probe-address']; $('test-url').value=h['test-url']; };
    const readSettings = () => { config.listen=value('listen').trim(); config.strategy=value('strategy'); config.priority=Math.trunc(number('priority',100)); config['dial-timeout']=value('dial-timeout').trim(); config['max-failover-attempts']=Math.max(1,Math.trunc(number('max-failover',3))); config['fail-open']=$('fail-open').checked; const h=config['health-check']; h.enabled=$('health-enabled').checked; h.interval=value('health-interval').trim(); h.timeout=value('health-timeout').trim(); h['isolation-threshold']=Math.max(1,Math.trunc(number('isolation-threshold',3))); h['isolation-duration']=value('isolation-duration').trim(); h['probe-address']=value('probe-address').trim(); h['test-url']=value('test-url').trim(); };
    const stateFor = (id) => (status && status.nodes || []).find((node)=>node.id===id) || {};
    const render = () => {
      const nodes=config.nodes||[]; $('nodes-empty').hidden=nodes.length>0;
      $('nodes').innerHTML=nodes.map((node,index)=>{const runtime=stateFor(node.id), state=runtime.state||'unknown'; return '<tr data-index="'+index+'"><td><input data-field="enabled" type="checkbox" '+(node.enabled?'checked':'')+'></td><td><input data-field="id" value="'+escapeHTML(node.id)+'"></td><td><input data-field="label" value="'+escapeHTML(node.label)+'"></td><td class="url"><input data-field="url" value="'+escapeHTML(node.url)+'"></td><td><input data-field="weight" type="number" min="1" value="'+node.weight+'"></td><td><input data-field="order" type="number" value="'+node.order+'"></td><td><span class="badge '+escapeHTML(state)+'">'+escapeHTML(state)+'</span></td><td><div class="row-actions"><button data-action="test">测试</button>'+(state==='isolated'?'<button data-action="recover">解除</button>':'')+'<button data-action="delete" class="danger">删除</button></div></td></tr>';}).join('');
      $('stat-total').textContent=status?status.total_nodes:nodes.length; $('stat-healthy').textContent=status?status.healthy_nodes:'-'; $('stat-isolated').textContent=status?status.isolated_nodes:'-'; $('stat-active').textContent=status?status.active_tunnels:'-'; $('stat-generation').textContent=status?status.generation:'-';
      const active=globalProxy===localProxy(); $('takeover').textContent=active?'停止接管':'接管全局代理'; $('takeover').className=active?'danger':''; $('runtime').textContent=status&&status.ready?(status.proxy_url+' · '+status.strategy):'插件未就绪';
      $('diagnostics').textContent=status?JSON.stringify({ready:status.ready,listen:status.listen,proxy_url:status.proxy_url,strategy:status.strategy,generation:status.generation,last_error:status.last_error,started_at:status.started_at,last_applied_at:status.last_applied_at,last_health_at:status.last_health_at},null,2):'暂无运行数据';
      $('status-nodes').innerHTML=(status&&status.nodes||[]).map((node)=>'<tr><td>'+escapeHTML(node.label||node.id)+'</td><td><span class="badge '+escapeHTML(node.state)+'">'+escapeHTML(node.state)+'</span></td><td>'+escapeHTML(node.success_connects||0)+' / '+escapeHTML(node.total_connects||0)+'</td><td>'+escapeHTML(node.latency_ms||'-')+'</td><td>'+escapeHTML([node.exit_ip,node.location].filter(Boolean).join(' · ')||'-')+'</td><td class="error">'+escapeHTML(node.last_error||'-')+'</td></tr>').join('');
    };
    const load = async () => { notify('加载中…'); try { const results=await Promise.all([request('GET','/plugins/'+PLUGIN_ID+'/config'),request('GET','/pro/proxy-pool/status').catch(()=>null),request('GET','/proxy-url')]); config=normalize(results[0]); status=results[1]; globalProxy=results[2]&&results[2]['proxy-url']||''; syncSettings(); render(); notify(''); } catch(error){ notify(error.message,true); } };
    const validate = () => { if(!/^127(?:\.\d{1,3}){3}:\d{1,5}$/.test(config.listen)&&!/^\[::1\]:\d{1,5}$/.test(config.listen)) throw new Error('监听地址必须是数字回环地址'); const ids=new Set(); for(const node of config.nodes){ node.id=String(node.id||'').trim(); node.url=String(node.url||'').trim(); if(!node.id||!node.url) throw new Error('节点 ID 和 URL 不能为空'); if(ids.has(node.id)) throw new Error('节点 ID 重复: '+node.id); ids.add(node.id); if(!/^(https?|socks5h?):\/\//i.test(node.url)) throw new Error('不支持的代理 URL: '+node.url); } };
    const save = async () => { readSettings(); try { validate(); notify('保存中…'); await request('PATCH','/plugins/'+PLUGIN_ID+'/config',config); await new Promise((resolve)=>setTimeout(resolve,400)); await load(); notify('已保存'); } catch(error){ notify(error.message,true); } };
    $('nodes').addEventListener('input',(event)=>{const target=event.target,row=target.closest('tr'); if(!row||!target.dataset.field)return; const node=config.nodes[Number(row.dataset.index)],field=target.dataset.field; node[field]=field==='enabled'?target.checked:(field==='weight'||field==='order'?Number(target.value):target.value);});
    $('nodes').addEventListener('click',async(event)=>{const button=event.target.closest('button'),row=event.target.closest('tr'); if(!button||!row)return; const index=Number(row.dataset.index),node=config.nodes[index],action=button.dataset.action; try { if(action==='delete'){config.nodes.splice(index,1);render();} if(action==='test'){notify('测试 '+node.id+'…'); const result=await request('POST','/pro/proxy-pool/test',{node_id:node.id,proxy_url:node.url,url:config['health-check']['test-url']}); notify(result.success?'测试成功: '+[result.exit_ip,result.location,result.latency_ms+'ms'].filter(Boolean).join(' · '):result.error,!result.success); await load();} if(action==='recover'){await request('POST','/pro/proxy-pool/recover',{node_id:node.id});await load();} } catch(error){notify(error.message,true);} });
    $('add-node').onclick=()=>{config.nodes.push({id:'proxy-'+Math.random().toString(36).slice(2,10),label:'',url:'',enabled:true,weight:1,order:(config.nodes.length+1)*10});render();};
    $('import-button').onclick=()=>{const lines=value('import').split(/\r?\n/),seen=new Set(config.nodes.map((node)=>node.url)); for(const raw of lines){const line=raw.trim();if(!line||line.startsWith('#'))continue;const parts=line.split('|').map((part)=>part.trim()).filter(Boolean),urlPart=parts.find((part)=>/^(https?|socks5h?):\/\//i.test(part))||line;if(seen.has(urlPart))continue;const urlIndex=parts.indexOf(urlPart),label=urlIndex>0?parts.slice(0,urlIndex).join(' '):'',weight=Number(parts[urlIndex+1])||1;config.nodes.push({id:'proxy-'+Math.random().toString(36).slice(2,10),label,url:urlPart,enabled:true,weight:Math.max(1,weight),order:(config.nodes.length+1)*10});seen.add(urlPart);}$('import').value='';render();};
    $('test-all').onclick=async()=>{try{notify('测试中…');const result=await request('POST','/pro/proxy-pool/test-all',{concurrency:4});const failed=(result.results||[]).filter((item)=>!item.success);notify(failed.length?failed.length+' 个节点测试失败':'全部测试成功',failed.length>0);await load();}catch(error){notify(error.message,true);}};
    $('reset-stats').onclick=async()=>{try{await request('POST','/pro/proxy-pool/reset-stats');await load();}catch(error){notify(error.message,true);}};
    $('takeover').onclick=async()=>{readSettings();try{const active=globalProxy===localProxy();if(!active){validate();await save();config['restore-proxy-url']=globalProxy&&globalProxy!==localProxy()?globalProxy:(config['restore-proxy-url']||'');await request('PATCH','/plugins/'+PLUGIN_ID+'/config',config);await request('PUT','/proxy-url',{value:localProxy()});}else{await request('PUT','/proxy-url',{value:config['restore-proxy-url']||''});}await load();}catch(error){notify(error.message,true);}};
    $('save').onclick=save; $('refresh').onclick=load;
    document.querySelectorAll('.tab').forEach((tab)=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach((item)=>item.classList.toggle('active',item===tab));['nodes','settings','diagnostics'].forEach((view)=>$('view-'+view).hidden=tab.dataset.view!==view);});
    load(); setInterval(()=>request('GET','/pro/proxy-pool/status').then((next)=>{status=next;render();}).catch(()=>{}),10000);
  })();
  </script>
</body>
</html>
