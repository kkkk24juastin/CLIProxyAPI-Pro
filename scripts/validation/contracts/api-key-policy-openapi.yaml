openapi: 3.1.0
info:
  title: CLIProxyAPI Pro API Key Policy Management
  version: 1.0.0
paths:
  /v0/management/api-key-policy-capabilities:
    get:
      operationId: getApiKeyPolicyCapabilities
      responses:
        "200":
          description: Explicit Core compatibility contract for the Management policy workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v0/management/api-key-policy-bindings:
    get:
      operationId: listApiKeyPolicyBindings
      responses:
        "200":
          description: Current upstream API keys merged with Pro policy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PolicyUnavailable" }
  /v0/management/api-key-policy-catalog:
    get:
      operationId: getApiKeyPolicyCatalog
      description: Current provider, effective-model, and provider-to-model relationships accepted by Profile writes
      responses:
        "200":
          description: Runtime catalog used to link allowed providers with allowed effective models
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PolicyUnavailable" }
  /v0/management/api-key-policy-profile-catalog:
    get:
      operationId: listApiKeyPolicyProfileCatalog
      description: Lightweight current Profile-name directory for request-monitoring filters; includes Profiles whose policies are currently orphaned
      responses:
        "200":
          description: Profile names from one atomic policy generation without API-key or policy-rule data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileCatalogSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/PolicyUnavailable" }
  /v0/management/api-key-policy-usage-target:
    post:
      operationId: resolveApiKeyPolicyUsageTarget
      description: Resolve one session- and config-generation-bound opaque Key reference for request-monitoring filtering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageTargetRequest" }
      responses:
        "200":
          description: Stable API Key fingerprint for the selected binding only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageTarget" }
        "400": { $ref: "#/components/responses/InvalidKeyReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StaleKeyReference" }
  /v0/management/api-key-policies:
    post:
      operationId: createApiKeyPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/InvalidProfile" }
        "404": { $ref: "#/components/responses/UpstreamKeyNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "503": { $ref: "#/components/responses/PolicyUnavailable" }
  /v0/management/api-key-policies/{policyId}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      operationId: getApiKeyPolicy
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/PolicyNotFound" }
    patch:
      operationId: updateApiKeyPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, version]
              properties:
                displayName: { type: string }
                version: { type: integer, minimum: 1 }
                profileId:
                  type: string
                  description: Existing Profile to atomically replace; empty only when createProfile is true
                profile: { $ref: "#/components/schemas/ProfileInput" }
                createProfile:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "409": { $ref: "#/components/responses/VersionConflict" }
    delete:
      operationId: deleteApiKeyPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, confirmPassthrough]
              properties:
                version: { type: integer, minimum: 1 }
                confirmPassthrough: { const: RESTORE_UNRESTRICTED_PASSTHROUGH }
      responses:
        "204": { description: Explicit policy deleted; new requests use passthrough }
        "409": { $ref: "#/components/responses/DeleteConfirmationRequired" }
  /v0/management/api-key-policies/{policyId}/delete-preview:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      operationId: previewDeleteApiKeyPolicy
      responses:
        "200":
          description: Server-derived permission expansion preview for deleting an explicit policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletePolicyPreview" }
        "404": { $ref: "#/components/responses/PolicyNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /v0/management/api-key-policies/{policyId}/profiles:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      operationId: createApiKeyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileWrite" }
      responses:
        "201":
          description: Profile created but not activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
  /v0/management/api-key-policies/{policyId}/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: replaceApiKeyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileWrite" }
      responses:
        "200":
          description: Profile replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
    delete:
      operationId: deleteApiKeyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "204": { description: Non-active profile deleted }
        "409": { $ref: "#/components/responses/ActiveProfileDeleteForbidden" }
  /v0/management/api-key-policies/{policyId}/active-profile:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    put:
      operationId: activateApiKeyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId, version]
              properties:
                profileId: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: New active profile published for new requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
  /v0/management/orphaned-api-key-policies/{policyId}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    delete:
      operationId: permanentlyDeleteOrphanedApiKeyPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, configGeneration]
              properties:
                version: { type: integer, minimum: 1 }
                configGeneration: { type: integer, minimum: 1 }
      responses:
        "204": { description: Orphaned policy permanently deleted }
        "409": { $ref: "#/components/responses/VersionConflict" }
components:
  parameters:
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
  schemas:
    PolicyCatalog:
      type: object
      additionalProperties: false
      required: [providers, models, modelProviders]
      properties:
        providers:
          type: array
          items: { type: string }
          uniqueItems: true
        models:
          type: array
          items: { type: string }
          uniqueItems: true
        modelProviders:
          type: object
          description: Effective model ID to the currently available provider IDs that can serve it
          additionalProperties:
            type: array
            items: { type: string }
            uniqueItems: true
    Capabilities:
      type: object
      required: [apiVersion, features]
      properties:
        apiVersion: { type: integer, minimum: 1 }
        features:
          type: array
          uniqueItems: true
          items:
            enum:
              - policy_crud
              - profile_crud
              - optimistic_concurrency
              - atomic_workspace_save
              - policy_backup_restore
              - policy_delete_preview
              - orphaned_purge_guard
              - takeover_control
              - usage_key_target
    PolicyState:
      type: string
      enum: [unconfigured, configured, orphaned, unavailable]
    ModelMapping:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
    ProfileInput:
      type: object
      required: [name, providers, models, mappings]
      properties:
        name: { type: string }
        providers:
          type: array
          minItems: 1
          items: { type: string }
        models:
          type: array
          minItems: 1
          items: { type: string }
        mappings:
          type: array
          items: { $ref: "#/components/schemas/ModelMapping" }
    ProfileWrite:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id, policyId, createdAtMs, updatedAtMs]
          properties:
            id: { type: string }
            policyId: { type: string }
            createdAtMs: { type: integer }
            updatedAtMs: { type: integer }
    Policy:
      type: object
      required: [id, displayName, state, activeProfileId, profiles, version, createdAtMs, updatedAtMs]
      properties:
        id: { type: string }
        displayName: { type: string }
        state: { $ref: "#/components/schemas/PolicyState" }
        activeProfileId: { type: string }
        profiles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Profile" }
        version: { type: integer, minimum: 1 }
        createdAtMs: { type: integer }
        updatedAtMs: { type: integer }
    CreatePolicyRequest:
      type: object
      required: [keyRef, displayName, initialProfile]
      properties:
        keyRef:
          type: string
          description: Short-lived opaque reference bound to the management session and config generation
        displayName: { type: string }
        initialProfile:
          $ref: "#/components/schemas/ProfileInput"
    UsageTargetRequest:
      type: object
      required: [keyRef]
      properties:
        keyRef:
          type: string
          description: Short-lived opaque reference returned by the binding list; never place it in a URL
    UsageTarget:
      type: object
      required: [apiKeyHash, configGeneration]
      properties:
        apiKeyHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Returned only for the explicitly selected protected keyRef
        configGeneration: { type: integer, minimum: 1 }
    ProfileCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, updatedAtMs]
      properties:
        id: { type: string }
        name: { type: string }
        updatedAtMs: { type: integer }
    ProfileCatalogSnapshot:
      type: object
      additionalProperties: false
      required: [items, policyGeneration]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProfileCatalogItem" }
        policyGeneration: { type: integer, minimum: 1 }
    Binding:
      type: object
      required: [maskedKey, keyRef, state, weakKey]
      properties:
        maskedKey: { type: string }
        keyRef:
          type: string
          description: Memory-only opaque reference; never persist or place in a URL
        state: { $ref: "#/components/schemas/PolicyState" }
        policy: { $ref: "#/components/schemas/Policy" }
        weakKey: { type: boolean }
    BindingPage:
      type: object
      required: [items, orphaned, nextCursor, configGeneration]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Binding" }
        orphaned:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        nextCursor: { type: string }
        configGeneration:
          type: integer
          minimum: 1
          description: Upstream API-key configuration snapshot generation shared by every page
    DeletePolicyPreview:
      type: object
      required: [policyId, version, change, targetPolicyMode, affectsNewRequestsOnly, requiresConfirmation, activeProfile]
      properties:
        policyId: { type: string }
        version: { type: integer, minimum: 1 }
        change: { const: restricted_profile_to_unrestricted_passthrough }
        targetPolicyMode: { const: passthrough }
        affectsNewRequestsOnly: { const: true }
        requiresConfirmation: { const: RESTORE_UNRESTRICTED_PASSTHROUGH }
        activeProfile:
          type: object
          required: [id, name, providers, models]
          properties:
            id: { type: string }
            name: { type: string }
            providers: { type: array, items: { type: string } }
            models: { type: array, items: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Management authentication required
    InvalidKeyReference:
      description: invalid_api_key_reference
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    StaleKeyReference:
      description: api_key_reference_stale
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidProfile:
      description: invalid_api_key_profile
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UpstreamKeyNotFound:
      description: upstream_api_key_not_found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PolicyNotFound:
      description: api_key_policy_not_found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    VersionConflict:
      description: config_version_conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ActiveProfileDeleteForbidden:
      description: active_profile_delete_forbidden
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    DeleteConfirmationRequired:
      description: policy_delete_requires_passthrough_confirmation
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PolicyUnavailable:
      description: api_key_policy_unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
